<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Піксельний Редактор</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding-top: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #e9e9e9;
        }
        .tools-container {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            align-items: center;
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .tool {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .tool label {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }
        #active-color-indicator {
            width: 40px;
            height: 40px;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px #ccc;
            border-radius: 5px;
        }
        #color-palette {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }
        .color-swatch {
            width: 25px;
            height: 25px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            transition: transform 0.1s;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        #grid-container {
            display: grid;
            border: 1px solid #333;
            background-color: #fff;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .pixel {
            width: 12px;
            height: 12px;
            background-color: #ffffff; /* Default color */
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        /* No longer need .active class, will use inline styles */
    </style>
</head>
<body>

    <h1>Піксельний Редактор</h1>

    <div class="tools-container">
        <div class="tool">
            <label>Активний колір:</label>
            <div id="active-color-indicator"></div>
        </div>
        <div class="tool">
            <label>Палітра:</label>
            <div id="color-palette"></div>
        </div>
    </div>

    <div id="grid-container"></div>

    <div class="controls">
        <button id="clear-btn">Очистити все</button>
        <button id="export-png-btn">Зберегти як PNG</button>
        <button id="export-text-btn">Зберегти як Текстовий Малюнок</button>
        <button id="export-coords-btn">Зберегти як Координати</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('grid-container');
            const gridSize = 50;

            // Set up grid columns and rows dynamically
            gridContainer.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            gridContainer.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
            gridContainer.style.border = '1px solid #333';

            // Create pixels and add coordinates for later export
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const pixel = document.createElement('div');
                    pixel.classList.add('pixel');
                    pixel.dataset.x = x;
                    pixel.dataset.y = y;
                    // Add a thin border to each pixel to form the grid lines
                    pixel.style.borderRight = '1px solid #eee';
                    pixel.style.borderBottom = '1px solid #eee';
                    gridContainer.appendChild(pixel);
                }
            }

            // --- App State ---
            const colors = ['#000000', '#FFFFFF', '#ff3838', '#ffb838', '#42ff38', '#3877ff', '#a938ff', '#ff38e4', '#808080', '#C0C0C0'];
            let currentColor = colors[0];
            let isDrawing = false;

            // --- DOM Elements ---
            const colorPalette = document.getElementById('color-palette');
            const activeColorIndicator = document.getElementById('active-color-indicator');
            const clearBtn = document.getElementById('clear-btn');

            // --- Initialization ---
            function initializeApp() {
                // Populate color palette
                colors.forEach(color => {
                    const swatch = document.createElement('div');
                    swatch.classList.add('color-swatch');
                    swatch.style.backgroundColor = color;
                    swatch.dataset.color = color;
                    if (color === '#FFFFFF') {
                        swatch.title = 'Гумка'; // Eraser tooltip
                    }
                    colorPalette.appendChild(swatch);
                });
                updateActiveColorIndicator();
            }

            function updateActiveColorIndicator() {
                activeColorIndicator.style.backgroundColor = currentColor;
            }

            initializeApp();

            // --- Event Listeners ---

            // Color selection from palette
            colorPalette.addEventListener('click', (event) => {
                if (event.target.dataset.color) {
                    currentColor = event.target.dataset.color;
                    updateActiveColorIndicator();
                }
            });

            // Clear canvas button
            clearBtn.addEventListener('click', () => {
                if (confirm('Ви впевнені, що хочете очистити полотно?')) {
                    const pixels = gridContainer.querySelectorAll('.pixel');
                    pixels.forEach(pixel => {
                        pixel.style.backgroundColor = '#ffffff';
                    });
                }
            });

            // Drawing logic
            function draw(event) {
                if (event.target.classList.contains('pixel')) {
                    event.target.style.backgroundColor = currentColor;
                }
            }

            gridContainer.addEventListener('mousedown', (event) => {
                event.preventDefault();
                isDrawing = true;
                draw(event);
            });

            gridContainer.addEventListener('mousemove', (event) => {
                if (isDrawing) {
                    draw(event);
                }
            });

            window.addEventListener('mouseup', () => {
                isDrawing = false;
            });

            gridContainer.addEventListener('mouseleave', () => {
                isDrawing = false;
            });

            // --- EXPORT FUNCTIONALITY ---

            function rgbToHex(rgb) {
                if (!rgb || !rgb.startsWith('rgb')) return rgb || '#ffffff'; // Return if already hex or empty

                // Extract numbers from "rgb(r, g, b)"
                const [r, g, b] = rgb.match(/\d+/g).map(Number);

                const toHex = (c) => ('0' + c.toString(16)).slice(-2);
                return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
            }

            function triggerDownload(filename, content) {
                const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            }

            const exportPngBtn = document.getElementById('export-png-btn');
            exportPngBtn.addEventListener('click', () => {
                const canvas = document.createElement('canvas');
                canvas.width = gridSize;
                canvas.height = gridSize;
                const ctx = canvas.getContext('2d');

                const pixels = gridContainer.querySelectorAll('.pixel');
                pixels.forEach(pixel => {
                    const x = parseInt(pixel.dataset.x);
                    const y = parseInt(pixel.dataset.y);
                    ctx.fillStyle = pixel.style.backgroundColor || '#ffffff';
                    ctx.fillRect(x, y, 1, 1);
                });

                const link = document.createElement('a');
                link.download = 'pixel-art.png';
                link.href = canvas.toDataURL('image/png');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });

            const exportTextBtn = document.getElementById('export-text-btn');
            exportTextBtn.addEventListener('click', () => {
                const pixels = gridContainer.querySelectorAll('.pixel');
                let grid = Array.from({ length: gridSize }, () => new Array(gridSize));

                pixels.forEach(pixel => {
                    const x = parseInt(pixel.dataset.x);
                    const y = parseInt(pixel.dataset.y);
                    grid[y][x] = rgbToHex(pixel.style.backgroundColor);
                });

                const csvContent = grid.map(row => row.join(',')).join('\n');
                triggerDownload('drawing.csv', csvContent);
            });

            const exportCoordsBtn = document.getElementById('export-coords-btn');
            exportCoordsBtn.addEventListener('click', () => {
                const pixels = gridContainer.querySelectorAll('.pixel');
                let csvRows = ['x,y,color'];
                const defaultColor = '#ffffff';

                pixels.forEach(pixel => {
                    const color = rgbToHex(pixel.style.backgroundColor);
                    if (color !== defaultColor) {
                        const x = pixel.dataset.x;
                        const y = pixel.dataset.y;
                        csvRows.push(`${x},${y},${color}`);
                    }
                });

                const csvContent = csvRows.join('\n');
                triggerDownload('coordinates.csv', csvContent);
            });
        });
    </script>

</body>
</html>
